name: Purge public Python history once

on:
  push:
    paths:
      - ".github/workflows/purge-python-history.yml"

permissions:
  contents: write

jobs:
  purge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Remove runtime patch from all public commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install --quiet git-filter-repo
          git filter-repo --path runtime_resilience_patch.py --invert-paths --force
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:main
