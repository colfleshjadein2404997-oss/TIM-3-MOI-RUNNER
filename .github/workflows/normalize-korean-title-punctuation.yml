name: Normalize Korean title punctuation once

on:
  push:
    paths:
      - '.github/workflows/normalize-korean-title-punctuation.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Replace Japanese middle dot with neutral Korean-friendly middle dot
        shell: python
        run: |
          from pathlib import Path
          path = Path('extra-titles.txt')
          text = path.read_text(encoding='utf-8').replace('・', '·')
          lines = [line for line in text.splitlines() if line.strip()]
          if len(lines) != 300:
              raise SystemExit(f'Expected 300 titles, got {len(lines)}')
          for number, line in enumerate(lines, 100):
              if not line.endswith(f'#{number}'):
                  raise SystemExit(f'Unexpected title order at #{number}')
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
      - name: Commit normalization
        run: |
          if git diff --quiet -- extra-titles.txt; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extra-titles.txt
          git commit -m 'Normalize Korean title punctuation [skip ci]'
          git push
